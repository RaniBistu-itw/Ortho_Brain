; PHP per-directory settings for OrthoBrain case media uploads.
; This file is read by the PHP built-in server (php artisan serve),
; PHP-FPM (when user_ini.filename is set), and Apache mod_php with
; AllowOverride. It ensures upload limits match the app's 5 MB cap
; regardless of the system php.ini defaults (often 2 M).
;
; upload_max_filesize must be >= the Laravel max:5120 rule in CaseMediaController.
; post_max_size must be >= upload_max_filesize (PHP drops the entire body otherwise).
upload_max_filesize = 10M
post_max_size = 10M
